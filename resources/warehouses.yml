# Serverless SQL warehouses used by the BI / reporting workloads (one per size benchmarked).
resources:
  sql_warehouses:
    wh_xsmall:
      name: sm-bench-xsmall
      cluster_size: X-Small
      enable_serverless_compute: true
      auto_stop_mins: 5
      max_num_clusters: 1
    wh_small:
      name: sm-bench-small
      cluster_size: Small
      enable_serverless_compute: true
      auto_stop_mins: 5
      max_num_clusters: 1
    wh_medium:
      name: sm-bench-medium
      cluster_size: Medium
      enable_serverless_compute: true
      auto_stop_mins: 5
      max_num_clusters: 1
